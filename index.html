<script>
/* Independent accounting model; no browser dependencies. */
(function (root) {
  'use strict';
  const categories = ['学习成长', '生活习惯', '运动健康', '其他'];
  const uid = () => globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2);
  const clone = value => JSON.parse(JSON.stringify(value));
  function initial() {
    return { schema: 1, nickname: '小朋友', rules: [
      { id: uid(), title: '认真阅读', points: 5, category: '学习成长' },
      { id: uid(), title: '主动整理房间', points: 3, category: '生活习惯' },
      { id: uid(), title: '坚持运动', points: 5, category: '运动健康' },
      { id: uid(), title: '按时完成作业', points: 5, category: '学习成长' }
    ], rewards: [
      { id: uid(), title: '选一份喜欢的小零食', cost: 30, note: '小小的快乐，自己来决定', icon: 'cookie' },
      { id: uid(), title: '周末电影时光', cost: 80, note: '和家人一起看一部喜欢的电影', icon: 'film' },
      { id: uid(), title: '一本心愿图书', cost: 150, note: '去书店，发现一个新的世界', icon: 'book' }
    ], entries: [] };
  }
  function assert(ok, message) { if (!ok) throw new Error(message); }
  function string(value, max, label, required = true) {
    assert(typeof value === 'string' && value.length <= max && (!required || value.trim().length > 0), label + '不正确');
  }
  function integer(value, label = '分数') { assert(Number.isSafeInteger(value) && value > 0 && value <= 100000, label + '须为 1～100000 的整数'); }
  function balance(state) { return state.entries.reduce((sum, e) => sum + e.delta, 0); }
  function reversedIds(state) { return new Set(state.entries.filter(e => e.type === 'reversal').map(e => e.ref)); }
  function active(state) { const ids = reversedIds(state); return state.entries.filter(e => e.type !== 'reversal' && !ids.has(e.id)); }
  function stats(state) {
    const list = active(state);
    return { balance: balance(state), earned: list.filter(e => e.type === 'earn').reduce((s,e) => s + e.delta, 0), deducted: list.filter(e => e.type === 'deduct').reduce((s,e) => s - e.delta, 0), redeemed: list.filter(e => e.type === 'redeem').reduce((s,e) => s - e.delta, 0) };
  }
  function validate(state) {
    assert(state && state.schema === 1, '无法识别本机数据，请不要清理浏览器数据');
    string(state.nickname, 20, '昵称');
    for (const key of ['rules', 'rewards', 'entries']) assert(Array.isArray(state[key]), '本机数据格式异常');
    const ids = new Set();
    for (const item of [...state.rules, ...state.rewards, ...state.entries]) {
      string(item.id, 100, '记录编号'); assert(!ids.has(item.id), '记录编号重复'); ids.add(item.id);
    }
    state.rules.forEach(r => { string(r.title, 40, '规则名称'); integer(Math.abs(r.points)); assert(categories.includes(r.category), '规则分类异常'); });
    state.rewards.forEach(r => { string(r.title, 40, '奖励名称'); integer(r.cost); string(r.note, 120, '奖励说明', false); });
    const reversed = new Set();
    state.entries.forEach(e => {
      assert(['earn','deduct','redeem','reversal'].includes(e.type), '记录类型异常');
      integer(Math.abs(e.delta)); assert((e.type !== 'earn' || e.delta > 0) && (!['deduct','redeem'].includes(e.type) || e.delta < 0), '记录分数异常');
      string(e.reason, 80, '记分原因'); string(e.note, 300, '备注', false);
      assert(Number.isFinite(Date.parse(e.at)) && Number.isFinite(Date.parse(e.createdAt)), '记录时间异常');
      if (e.type === 'reversal') {
        const original = state.entries.find(x => x.id === e.ref && x.type !== 'reversal');
        assert(original && original.delta === -e.delta && !reversed.has(e.ref), '撤销记录异常'); reversed.add(e.ref);
      }
    });
    assert(Math.abs(balance(state)) <= 1000000000, '可用积分超出允许范围');
    return state;
  }
  function add(state, input) {
    const next = clone(state);
    assert(['earn','deduct','redeem'].includes(input.type), '请选择有效的记分类型');
    integer(input.points); string(input.reason, 80, '记分原因'); string(input.note || '', 300, '备注', false);
    const date = new Date(input.at || Date.now());
    assert(Number.isFinite(date.getTime()) && date.getTime() <= Date.now() + 60000, '发生时间不能晚于现在');
    const delta = input.type === 'earn' ? input.points : -input.points;
    if (input.type === 'redeem') assert(balance(next) + delta >= 0, '当前积分不足，暂时不能兑换');
    next.entries.push({ id: uid(), type: input.type, delta, reason: input.reason.trim(), category: input.type === 'redeem' ? '奖励兑换' : (categories.includes(input.category) ? input.category : '其他'), note: (input.note || '').trim(), at: date.toISOString(), createdAt: new Date().toISOString() });
    return validate(next);
  }
  function undo(state, id) {
    const entry = state.entries.find(e => e.id === id);
    assert(entry && entry.type !== 'reversal' && !reversedIds(state).has(id), '这条记录已经撤销或不存在');
    const next = clone(state), now = new Date().toISOString();
    next.entries.push({ id: uid(), type: 'reversal', delta: -entry.delta, reason: '撤销：' + entry.reason, category: entry.category, note: '', at: now, createdAt: now, ref: id });
    // The original reason can occupy 80 characters; allow its reversal prefix separately.
    next.entries[next.entries.length - 1].reason = next.entries[next.entries.length - 1].reason.slice(0,80);
    return validate(next);
  }
  const api = { categories, uid, clone, initial, validate, balance, stats, active, reversedIds, add, undo };
  root.ScoreCore = api;
  if (typeof module !== 'undefined') module.exports = api;
})(globalThis);

</script>

  function offlineStatus() {
    if (singleFile) return location.protocol === 'file:'
      ? '当前为单 HTML 文件版，页面资源全部内嵌，可在本机直接打开使用。请固定使用同一文件位置和浏览器。'
      : '当前为单 HTML 文件版。部署只需这一个文件；打开页面需要联网，积分保存在本机。添加到主屏幕后仍需联网打开，不保证离线重开。';
    if (location.protocol === 'file:') return '当前为本地文件模式，可在本机浏览器中使用。iPhone 主屏幕安装需要通过 HTTPS 地址访问。';
    if (!window.isSecureContext || !('serviceWorker' in navigator)) return '当前环境不支持离线安装。iPhone 主屏幕安装需要使用 Safari 访问 HTTPS 地址。';
    return navigator.serviceWorker.controller ? '离线功能已就绪。iPhone 可在 Safari 中使用“分享 → 添加到主屏幕”。' : '正在准备离线资源，首次使用请保持联网片刻。';
  }
  if (!fatal) render();
  if (!singleFile && !fatal && 'serviceWorker' in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)) {
    let waitingWorker;
    navigator.serviceWorker.register('./sw.js').then(reg => {
      const showUpdate = () => { if (reg.waiting && navigator.serviceWorker.controller) { waitingWorker = reg.waiting; $('#update-banner').hidden = false; } };
      showUpdate();
      reg.addEventListener('updatefound', () => { const worker = reg.installing; worker?.addEventListener('statechange', () => { if (worker.state === 'installed') showUpdate(); }); });
      navigator.serviceWorker.ready.then(() => { const status = $('#offline-status'); if (status) status.textContent = '离线资源已准备好。iPhone 可在 Safari 中使用“分享 → 添加到主屏幕”。'; });
    }).catch(() => { const status = $('#offline-status'); if (status) status.textContent = '离线资源暂未准备成功，请在联网后重新打开网页。当前仍可正常记分。'; });
    let reloadForUpdate = false;
    $('#update-button').addEventListener('click', () => { if ($('#dialog').open) { toast('请先保存或关闭正在编辑的内容，再更新'); return; } reloadForUpdate = true; waitingWorker?.postMessage({type:'SKIP_WAITING'}); });
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloadForUpdate) location.reload(); else { const status = $('#offline-status'); if (status) status.textContent = offlineStatus(); } });
  }
})();

</script>
